name: Local AWS Deployment Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floci-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Deploy and Test
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Run Unit Tests
        run: |
          PYTHONPATH=app python3 -m unittest discover \
            -s tests \
            -p "test_handler.py" \
            -v

      - name: Start Floci
        run: |
          docker compose up -d

      - name: Wait for AWS infrastructure to be ready
        run: |
          for i in $(seq 1 30); do
            if aws s3 ls --endpoint-url http://localhost:4566 > /dev/null 2>&1; then
              echo "AWS infrastructure is ready."
              exit 0
            fi

            echo "Waiting for AWS infrastructure to be ready... ($i/30)"
            sleep 5
          done

          echo "AWS infrastructure did not become ready in time."
          docker compose logs
          exit 1

      - name: Package Application
        run: |
          mkdir -p build
          zip -j build/lambda.zip app/handler.py

      - name: Initialize Terraform
        id: terraform_init
        run: |
          terraform -chdir=infra init -input=false
          echo "initialized=true" >> "$GITHUB_OUTPUT"

      - name: Check Terraform Formatting
        run: |
          terraform -chdir=infra fmt -check

      - name: Validate Terraform
        run: |
          terraform -chdir=infra validate

      - name: Plan Infrastructure
        run: |
          terraform -chdir=infra plan -out=tfplan -input=false

      - name: Apply Infrastructure
        run: |
          terraform -chdir=infra apply -input=false tfplan

      - name: Run Deployment Tests
        run: |
          python3 tests/smoke.py

      - name: Show Floci Logs on Failure
        if: failure()
        run: |
          echo "Deployment failed. Showing Floci logs:"
          docker compose logs --tail=200

      - name: Destroy Test Infrastructure
        if: always() && steps.terraform_init.outputs.initialized == 'true'
        run: |
          terraform -chdir=infra destroy -auto-approve

      - name: Stop Floci
        if: always()
        run: |
          docker compose down -v
